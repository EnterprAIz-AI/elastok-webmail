server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/javascript;

    # A imagem do nginx nao conhece .mjs e o serve como application/octet-stream.
    # O navegador aplica MIME check estrito em modulo: isso derruba tanto o
    # `new Worker(url, {type:'module'})` quanto o import() de fallback — foi o que
    # impedia o pdf.js de renderizar a miniatura dos PDFs. `types` dentro do
    # location define o tipo so para esses arquivos, sem mexer no mapa global.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # service worker e manifest sempre revalidados (PWA)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # assets com hash no nome podem cachear agressivo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
